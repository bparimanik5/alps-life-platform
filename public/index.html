<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ALPS - Aviva Life Platform (mock)</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><header><h1>ALPS <span>Aviva Life Platform (mock)</span></h1><p>Demo journeys backed by an in-memory REST API.</p></header>
<nav aria-label="Journeys"><button class="tab active" data-tab="quote">Quote</button><button class="tab" data-tab="claims">Claims</button><button class="tab" data-tab="policy">Policy servicing</button></nav>
<section id="quote" class="panel active"><h2>Life cover quote</h2><form id="quote-form"><label>Age<input name="age" type="number" min="18" max="80" value="40" required></label><label>Cover (?)<input name="coverAmount" type="number" min="1" value="100000" required></label><label>Product<select name="product"><option value="standard">Standard</option><option value="over50">Over-50</option></select></label><label>Smoked in last 12 months?<select name="smokerStatus"><option value="">Choose?</option><option value="false">No</option><option value="true">Yes</option></select></label><label>Email<input name="customerEmail" type="email" value="demo@example.test"></label><label class="check"><input name="condition" type="checkbox"> Pre-existing condition declared (routes to referral)</label><button>Create quote</button></form><div id="quote-result" class="result" aria-live="polite"></div><form id="smoker-followup" hidden><label>Smoked in last 12 months?<select name="smokerStatus" required><option value="">Choose?</option><option value="false">No</option><option value="true">Yes</option></select></label><button>Show monthly premiums</button></form></section>
<section id="claims" class="panel"><h2>Death notification claim</h2><form id="claim-form"><label>Seed policy<select name="policyId"><option>POL-1001</option><option>POL-1002</option></select></label><label>Years in force<input name="years" type="number" min="0" max="100" value="2"></label><button>Create claim</button></form><div id="claim-result" class="result" aria-live="polite"></div><form id="document-form" hidden><label>Document type<select name="type"><option value="death-certificate">Death certificate</option><option value="claimant-id">Claimant ID</option></select></label><label>PDF, JPEG or PNG (max 10 MB)<input name="file" type="file" accept="application/pdf,image/jpeg,image/png" required></label><button>Upload document</button></form></section>
<section id="policy" class="panel"><h2>Policy servicing</h2><label>Seed policy<select id="policy-id"><option>POL-1001</option><option>POL-1002</option></select></label><div class="actions"><button id="load-policy">Load policy</button><button id="trust-policy">Put in trust</button><button id="cancel-policy">Cancel policy</button></div><div id="policy-result" class="result" aria-live="polite"></div></section>
<aside><button id="show-outbox">Show email outbox</button><pre id="outbox" hidden></pre></aside></main><script src="/app.js"></script></body></html>
